name: Testes
on:
  push:
  pull_request:

jobs:
  ia-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ia-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: ia-api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # Avaliação do assistente sem o Gemini (46 casos de FAQ, contexto, segurança...): reprova o commit se cair de 100%.
      - run: python -m avaliacao --local --sem-modelo --pausa 0 --minimo 1.0 --md avaliacao-ci.md
        env: { IA_LIMITE_POR_MINUTO: '1000' }
      - if: always()
        run: cat avaliacao-ci.md >> "$GITHUB_STEP_SUMMARY" || true

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: versao-real/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_sqlite, sqlite3, mbstring' }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: versao-real/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: versao-real/frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
